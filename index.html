<body>
  <div id="app">别急,你也即将成为一名PostgreSQL高手!</div>

  <div id="coffee-btn" class="coffee-btn">
    <button type="button" aria-haspopup="dialog" aria-controls="imageModal">
      <span aria-hidden="true">☕</span>
      支持作者
    </button>
  </div>

  <div id="imageModal" class="support-modal" role="dialog" aria-modal="true" aria-labelledby="support-title" hidden>
    <div class="support-modal__panel">
      <button type="button" class="support-modal__close" aria-label="关闭支持作者弹窗">&times;</button>
      <img src="images/wechat_pay.png" alt="微信赞赏码" loading="lazy">
      <p id="support-title">维护不易，多谢你的资瓷！一分也是爱 ❤️</p>
    </div>
  </div>

  <script>
    (function () {
      var trigger = document.querySelector('#coffee-btn button');
      var modal = document.getElementById('imageModal');
      var closeButton = document.querySelector('.support-modal__close');

      function showSupportModal() {
        modal.hidden = false;
        closeButton.focus();
      }

      function closeSupportModal() {
        modal.hidden = true;
        trigger.focus();
      }

      trigger.addEventListener('click', showSupportModal);
      closeButton.addEventListener('click', closeSupportModal);
      modal.addEventListener('click', function (event) {
        if (event.target === modal) {
          closeSupportModal();
        }
      });
      window.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !modal.hidden) {
          closeSupportModal();
        }
      });
    })();

    function toDocsifyRoute(href) {
      if (!href || href.indexOf('http://') === 0 || href.indexOf('https://') === 0 || href.indexOf('mailto:') === 0) {
        return '';
      }

      var cleanHref = href.split('#')[0].split('?')[0];
      cleanHref = cleanHref.replace(/^\.\//, '').replace(/^\//, '');

      if (cleanHref === 'README.md') {
        return '/README';
      }

      if (cleanHref.indexOf('docs/') === 0 && cleanHref.slice(-3) === '.md') {
        return '/' + cleanHref.slice(0, -3);
      }

      return '';
    }

    document.addEventListener('click', function (event) {
      var link = event.target.closest('a');
      if (!link) {
        return;
      }

      var route = link.getAttribute('data-docs-route') || toDocsifyRoute(link.getAttribute('href'));
      if (route) {
        event.preventDefault();
        window.location.hash = route;
      }
    }, true);

    (function () {
      function syncDarkClass() {
        var darkTheme = document.getElementById('docsify-dark-theme');
        document.body.classList.toggle('dark', Boolean(darkTheme && !darkTheme.disabled));
      }

      window.addEventListener('DOMContentLoaded', function () {
        var darkTheme = document.getElementById('docsify-dark-theme');
        syncDarkClass();

        if (darkTheme && window.MutationObserver) {
          new MutationObserver(syncDarkClass).observe(darkTheme, {
            attributes: true,
            attributeFilter: ['disabled']
          });
        }

        window.setInterval(syncDarkClass, 500);
      });
    })();

    window.$docsify = {
      name: 'postgres-howto in chinese',
      repo: 'https://github.com/xiongcccc',
      maxLevel: 5, // 最大支持渲染的标题层级
      subMaxLevel: 3,
      homepage: 'README.md',
      coverpage: true,
      loadSidebar: true,
      loadNavbar: true,
      auto2top: true, // 切换页面后是否自动跳转到页面顶部
      onlyCover: true,
      search: {
        //maxAge: 86400000, // 过期时间，单位毫秒，默认一天
        paths: 'auto',
        placeholder: '搜索',
        noData: '找不到结果',
        // 搜索标题的最大层级, 1 - 6
        depth: 3,
      },
      pagination: {
        previousText: '上一章节',
        nextText: {
          '/en/': 'NEXT',
          '/': '下一章节'
        },
        crossChapter: true,
        crossChapterText: true,
      },
      gitalkWithFooter: {
        //footerInnerHtml: "<p>到底了,别再划了!</p>",
        gitalkConfig: {
          clientID: 'Ov23liQBwmxWjc0oPeFw', // Your Client Id
          clientSecret: 'c71a6283d1190656fe158e02b16f1ca9d08e3e61', // Your Client secret
          repo: 'gitalk-comment',
          owner: 'xiongcccc',
          admin: ['xiongcccc'],
          // facebook-like distraction free mode
          distractionFreeMode: false,
        }
      },
      switchLightDarkMode: {
        useSwitchMode: true,
        top: 130,
        right: 26,
        svgColor: '#7d7b75',
      },
    }
  </script>

  <!-- docsify-edit-on-github -->
